name: Release Build

on:
  release:
    types: [ published ]
    
permissions:
  contents: write

jobs:
  build-and-attach:
    name: Build DLL and attach to release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Locate the .csproj
        id: locate
        run: |
          CSPROJ=$(find . -maxdepth 4 -name "*.csproj" | head -n 1)
          if [ -z "$CSPROJ" ]; then
            echo "No .csproj file found in the repository." >&2
            exit 1
          fi
          PROJECT_NAME=$(basename "$CSPROJ" .csproj)
          echo "Project file found: $CSPROJ (name: $PROJECT_NAME)"
          echo "csproj=$CSPROJ" >> "$GITHUB_OUTPUT"
          echo "project_name=$PROJECT_NAME" >> "$GITHUB_OUTPUT"

      - name: Build (Release)
        run: dotnet build "${{ steps.locate.outputs.csproj }}" --no-restore --configuration Release

      - name: Locate the compiled .dll
        id: find_dll
        run: |
          PROJECT_NAME="${{ steps.locate.outputs.project_name }}"
          DLL_PATH=$(find . -path "*/bin/Release/*/${PROJECT_NAME}.dll" | head -n 1)
          if [ -z "$DLL_PATH" ]; then
            echo "Unable to locate ${PROJECT_NAME}.dll after the build." >&2
            exit 1
          fi
          echo "DLL found: $DLL_PATH"
          echo "dll_path=$DLL_PATH" >> "$GITHUB_OUTPUT"

      - name: Attach the .dll to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ steps.find_dll.outputs.dll_path }}" \
            --clobber